<svg xmlns="http://www.w3.org/2000/svg" width="940" height="670" viewBox="0 0 940 670">
  <title>Reconstructing a missing public transportation check-out</title>
  <desc>Home, work, gym, and market are connected in a trip chain. Two segments show smart-card tags. A question mark identifies a missing record, and a magnifier highlights a schematic of trip records and stop clusters.</desc>
  <defs>
    <marker id="route-arrow" viewBox="0 0 12 12" markerWidth="2.5" markerHeight="2.5" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#5b98c8"/>
    </marker>
    <symbol id="bus" viewBox="0 0 68 67">
      <g fill="#fff" stroke="#17212e" stroke-width="3" stroke-linejoin="round">
        <rect x="5" y="18" width="7" height="17" rx="2"/>
        <rect x="56" y="18" width="7" height="17" rx="2"/>
        <rect x="15" y="46" width="8" height="17" rx="3"/>
        <rect x="45" y="46" width="8" height="17" rx="3"/>
        <rect x="10" y="5" width="48" height="49" rx="8"/>
        <path d="M11 15h46v22H11z"/>
        <rect x="24" y="9" width="20" height="3" rx="1.5"/>
        <circle cx="19" cy="46" r="3"/>
        <circle cx="49" cy="46" r="3"/>
      </g>
    </symbol>
    <symbol id="tag" viewBox="0 0 55 65">
      <text x="27" y="19" fill="#17212e" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Tag</text>
      <rect x="5" y="25" width="45" height="31" rx="3" fill="#fff" stroke="#17212e" stroke-width="3"/>
      <path d="M7 34h41v7H7zm5 13h11v3H12zm15 0h5v3h-5z" fill="#17212e"/>
    </symbol>
    <g id="cluster">
