      <circle cx="-2" cy="-4" r="2.2"/><circle cx="1" cy="6" r="2.6"/><circle cx="5" cy="-9" r="2.5"/>
      <circle cx="8" cy="2" r="2.3"/><circle cx="13" cy="-3" r="2"/><circle cx="6" cy="11" r="2"/>
      <circle cx="-2" cy="14" r="2"/><circle cx="-15" cy="8" r="1.7"/><circle cx="3" cy="-15" r="1.7"/>
    </g>
  </defs>
