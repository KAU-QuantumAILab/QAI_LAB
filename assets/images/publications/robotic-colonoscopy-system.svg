<svg xmlns="http://www.w3.org/2000/svg" width="560" height="344" viewBox="0 0 560 344">
  <title>Autonomous robotic colonoscopy experimental setup</title>
  <desc>Camera images from the colonoscopy simulator are sent to the control model. The model sends commands to a three-degree-of-freedom robot that operates the scope in the simulator. Joysticks are used during training data collection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#2a6870"/>
    </marker>
  </defs>
  <rect width="560" height="344" fill="#f3f9f9"/>
  <g fill="none" stroke="#2a6870" stroke-width="3" marker-end="url(#arrow)">
    <path d="M243 84h68"/>
    <path d="M424 126v37"/>
    <path d="M317 211h-68"/>
    <path d="M136 169v-37"/>
  </g>
  <g stroke="#9ebdc0" stroke-width="2">
    <rect x="31" y="44" width="210" height="80" rx="10" fill="#fff"/>
    <rect x="319" y="44" width="210" height="80" rx="10" fill="#e3f2f1"/>
    <rect x="319" y="171" width="210" height="80" rx="10" fill="#e3f2f1"/>
    <rect x="31" y="171" width="210" height="80" rx="10" fill="#fff"/>
  </g>
  <g text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#153c47">
    <text x="136" y="93">Camera</text>
    <text x="424" y="93">Control model</text>
    <text x="424" y="220">3-DOF robot</text>
    <text x="136" y="220">Simulator</text>
  </g>
  <rect x="111" y="275" width="338" height="42" rx="21" fill="#e3f2f1"/>
  <text x="280" y="302" fill="#2a6870" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Joystick training data</text>
</svg>
